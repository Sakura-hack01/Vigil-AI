global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    pipeline: fraud-detection
    environment: production

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - alert_rules.yml

scrape_configs:
  - job_name: 'fraud-detector'
    static_configs:
      - targets: ['fraud-detector:8001']
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9101']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
